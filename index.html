<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria San Marcos - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-primary bg-gradient">

  <header class="text-center text-white py-3">
    <span class="fs-5 fw-semibold">🐾 Veterinaria San Marcos</span>
  </header>

  <main class="d-flex align-items-center justify-content-center flex-grow-1">
    <div class="card shadow login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <h1 class="h3 text-primary fw-bold">Ingreso al sistema</h1>
          <p class="text-muted">Ingresa con tu cuenta según tu perfil</p>
        </div>

        <form>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" placeholder="Ej: recepcion">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña">
          </div>
          <button type="button" class="btn btn-primary w-100" onclick="iniciarSesion()">Iniciar sesión</button>
        </form>

        <hr class="my-4">

        <p class="small text-muted mb-1">Usuarios de prueba:</p>
        <ul class="small text-muted mb-0">
          <li>recepcion / recepcion123</li>
          <li>veterinario / veterinario123</li>
          <li>admin / admin123</li>
        </ul>
      </div>
    </div>
  </main>

  <footer class="text-center text-white py-3 small">
    &copy; 2026 Veterinaria San Marcos
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
